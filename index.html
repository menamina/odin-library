<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library</title>
    <link rel="stylesheet" href="library.css">
</head>
<body>
    <table>

        <th>Your Library
            <td>Title</td>
            <td>Author</td>
            <td>Number of pages</td>
        </th>

        <tbody class="display"></tbody>
    
    </table>

    <button class="openModal">New Book</button>

    <dialog class="modal">
        <form method="dialog">
            <label for="">Title</label>
            <input id="title" type="text" minlength="2">
            <label for="">Author</label>
            <input id="author" type="text" minlength="2">
            <label for="">Number of Pages</label>
            <input id="pageNum" type="number">
            <button class="submit">add book!</button>
            <button class="cancel">cancel</button>
        </form>
    </dialog>
</body>
<script src="library.js"></script>
</html>
